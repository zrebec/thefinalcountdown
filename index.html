<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var path = location.pathname;
        if (!path || path.charAt(path.length - 1) === "/") return;
        var last = path.split("/").pop() || "";
        if (last.indexOf(".") !== -1) return;
        location.replace(path + "/" + location.search + location.hash);
      })();
    </script>
